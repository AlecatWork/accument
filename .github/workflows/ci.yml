# Runs automatically on every push and pull request.
# If any step fails (bad style, a broken test, or a search-quality drop), the build turns red.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Style and mistake check
        run: ruff check app tests evals scripts
      - name: Tests
        run: pytest tests
      - name: Search-quality gate (fails the build if the score drops below 90%)
        run: python -m evals.retrieval_eval --min-score 0.9

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: frontend/requirements.txt
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - run: pytest tests

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Check that the compose file is valid and the images build
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose build
